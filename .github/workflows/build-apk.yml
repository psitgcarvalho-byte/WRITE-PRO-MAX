name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: mkdir -p assets && cp icon.png assets/icon.png
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#ECE7DC' --iconBackgroundColorDark '#ECE7DC' --splashBackgroundColor '#ECE7DC' --splashBackgroundColorDark '#ECE7DC' || true
        env: { CI: "true" }
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: EnsaiosPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK no link fixo (Releases)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EnsaiosPro.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk EnsaiosPro.apk --title "Ensaios Pro — APK mais recente" --notes "Abra este link no celular, baixe EnsaiosPro.apk e instale. Antes de atualizar, faça Backup (.json) no app e desinstale a versão anterior." --latest

